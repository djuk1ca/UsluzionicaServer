name: CD — Azure

# ═══════════════════════════════════════════════════════════════════════════
# KAKO SE OVAJ WORKFLOW POVEZUJE SA CI-jem
#
# `workflow_run` znači: pokreni se TEK KAD workflow "CI" završi. Ne na push.
#
# Zašto ne prosto `on: push: branches: [main]`: tada bi CD i CI krenuli
# ISTOVREMENO, pa bi se deployovao kod čiji testovi još nisu ni završili — a
# možda i neće proći. `workflow_run` + provera zaključka ispod garantuje da se
# objavljuje samo ono što je prošlo sve kapije.
#
# `workflow_dispatch` ostaje za ručni redeploy bez novog commita.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Dva deploya odjednom bi se otimala oko istog App Service-a.
# cancel-in-progress: false — deploy koji je počeo MORA da se završi; prekid
# usred zamene slike ostavlja servis u polustanju.
concurrency:
  group: cd-azure
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. BUILD I OBJAVA SLIKE NA GITHUB CONTAINER REGISTRY
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build i push slike
    runs-on: ubuntu-latest

    # KAPIJA: `workflow_run` se okida i kad CI PADNE. Bez ove provere bi se
    # deployovao pokvaren kod — što je gore nego da CD uopšte ne postoji.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write          # obavezno za push na ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run se izvršava nad podrazumevanom granom, pa se commit
          # koji je pokrenuo CI mora eksplicitno navesti — inače bi se gradio
          # noviji kod od onog koji je testiran.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Prijava na GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN je automatski; NIJE potrebno praviti tajnu za ovo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Odredi tagove
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Dva taga na istoj slici, i oba su potrebna:
          #   sha-a1b2c3d → tačno se zna koji commit je u produkciji, i može
          #                 se rollback-ovati na prethodni jednom komandom
          #   latest     → čitljivo ime za ručno povlačenje
          #
          # Deploy uvek koristi SHA tag. `latest` je pogodnost za ljude —
          # deploy po `latest`-u znači da ne znaš šta ti se vrti.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Postavi Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 2. MIGRACIJE — ZASEBAN KORAK, PRE DEPLOYA
  #
  # Program.cs zove MigrateAsync() pri startu, što je zgodno lokalno ali loše
  # u produkciji iz dva razloga:
  #   1. Sa dve instance obe krenu u migraciju istovremeno.
  #   2. Ako migracija pukne, kontejner uđe u crash-loop i teško je videti zašto.
  #
  # Ovde se migracije primenjuju SQL skriptom pre nego što nova slika krene.
  # `--idempotent` znači da skripta sama proverava šta je već primenjeno, pa je
  # bezbedno pustiti je i kad nema ničeg novog.
  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    name: Migracije baze
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production        # vidi napomenu o Environments na dnu

    permissions:
      contents: read
      id-token: write              # OIDC — vidi korak "Prijava na Azure" ispod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Postavi .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instaliraj EF alat
        run: dotnet tool install --global dotnet-ef

      - name: Generiši idempotentnu SQL skriptu
        run: >
          dotnet ef migrations script
          --idempotent
          --project UsluzionicaServer.csproj
          --output migrations.sql
        env:
          # SecretsGuard traži ove vrednosti i pri generisanju skripte, jer se
          # aplikacija pravi u memoriji da bi se DbContext razrešio.
          # Ovo su LAŽNE vrednosti — skripta se generiše iz koda, ne iz baze.
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=x;Trusted_Connection=True;"
          Jwt__Secret: "ci-placeholder-secret-dovoljno-dug-za-hmac-sha256-validaciju"
          Jwt__Issuer: "usluzionica-api"
          Jwt__Audience: "usluzionica-app"
          Encryption__MessageKey: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          AdminSeed__Email: "placeholder@usluzionica.rs"
          AdminSeed__Password: "Placeholder123!"

      # Prijava je OVDE neophodna, iako ovaj job ne dira App Service.
      #
      # Azure SQL propušta samo IP adrese sa firewall liste, a GitHub runner
      # dobija nasumičnu adresu pri svakom pokretanju — nemoguće je unapred je
      # dodati. `azure/sql-action` ume da doda svoju adresu na listu pre upisa
      # i skloni je posle, ali samo ako je sesija prijavljena.
      #
      # Alternativa bi bila trajno otvoriti bazu ka celom internetu. Nije opcija.
      - name: Prijava na Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Primeni migracije na Azure SQL
        uses: azure/sql-action@v2
        with:
          # TAJNA — nikad u repou. Vidi objašnjenje o GitHub Secrets na dnu.
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: migrations.sql

  # ──────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY NA AZURE APP SERVICE
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy na Azure
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    permissions:
      contents: read
      # OBAVEZNO za OIDC prijavu na Azure. Bez ovoga `azure/login` puca sa
      # porukom da ne može da dobije token.
      id-token: write

    steps:
      # ── PRIJAVA BEZ LOZINKE (OIDC) ───────────────────────────────────────
      # Klasičan način je `creds: ${{ secrets.AZURE_CREDENTIALS }}` — JSON sa
      # client secret-om koji važi godinu dana i stoji u GitHub Secrets.
      #
      # OIDC je bolji: GitHub izdaje kratkotrajan token (važi minutima) koji
      # Azure prihvata JEDINO za ovaj repo i ovu granu. Nema tajne koja može
      # da procuri, nema rotacije, i ukradeni token je bezvredan za minut.
      - name: Prijava na Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy slike na App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          # SHA tag, ne `latest` — deploy mora biti ponovljiv i vratljiv.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

      # ── SMOKE TEST ───────────────────────────────────────────────────────
      # Deploy koji je "uspeo" a aplikacija ne odgovara je i dalje neuspeh.
      # Ovaj korak je razlika između "slika je postavljena" i "radi".
      #
      # Petlja sa čekanjem je neophodna: App Service treba 30-90 s da povuče
      # sliku i pokrene kontejner, a migracije su već primenjene pa start
      # nije trenutan.
      - name: Smoke test /health
        run: |
          set -euo pipefail
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Čekam da $URL odgovori..."

          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [[ "$CODE" == "200" ]]; then
              echo "Zdrav posle $((i*10)) s: $(cat /tmp/health.txt)"
              echo "### Deploy uspešan — /health vraća 200" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            echo "  pokušaj $i/30: HTTP $CODE"
            sleep 10
          done

          echo "::error::/health nije odgovorio 200 ni posle 5 minuta."
          echo "Poslednji odgovor: $(cat /tmp/health.txt || echo '(prazno)')"
          exit 1

      # Ako smoke test padne, prethodna verzija se vraća ručno:
      #   az webapp config container set --docker-custom-image-name ghcr.io/.../sha-PRETHODNI
      # Automatski rollback nije dodat namerno — na jednoj instanci bi
      # petljanje sa automatskim vraćanjem lako napravilo veću štetu nego
      # jedan minut nedostupnosti dok se ne pogleda log.
      - name: Uputstvo za rollback ako je palo
        if: failure()
        run: |
          echo "### Deploy pao — rollback" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "az webapp config container set \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name ${{ vars.AZURE_WEBAPP_NAME }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-PRETHODNI" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

# ═══════════════════════════════════════════════════════════════════════════
# ŠTA TREBA PODESITI PRE PRVOG POKRETANJA
#
# Repo → Settings → Secrets and variables → Actions
#
#   Secrets (šifrovani, ne mogu se pročitati posle upisa):
#     AZURE_CLIENT_ID              iz App Registration
#     AZURE_TENANT_ID              iz App Registration
#     AZURE_SUBSCRIPTION_ID        iz Azure portala
#     AZURE_SQL_CONNECTION_STRING  connection string ka Azure SQL bazi
#
#   Variables (obična konfiguracija, vidljiva u logovima — i to je u redu):
#     AZURE_WEBAPP_NAME            npr. usluzionica-api
#     AZURE_RESOURCE_GROUP         npr. usluzionica-rg
#
# Repo → Settings → Environments → New environment → "production"
#   Environment je zaseban sloj: može da traži RUČNO ODOBRENJE pre deploya i
#   da ograniči koje grane smeju u njega. Job-ovi `migrate` i `deploy` ga
#   koriste, pa bez njega neće ni krenuti.
# ═══════════════════════════════════════════════════════════════════════════
