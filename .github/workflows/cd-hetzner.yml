name: CD — Hetzner

# ═══════════════════════════════════════════════════════════════════════════
# KAKO SE RAZLIKUJE OD AZURE CD-a
#
# Azure App Service je upravljana usluga: kažeš mu ime slike i on sve ostalo
# uradi sam. Hetzner Cloud je gola Linux mašina — ti si i platforma.
#
# Zato ovde nema `azure/webapps-deploy`. Umesto toga:
#   1. slika se objavi na GHCR (isto kao za Azure)
#   2. preko SSH-a se na serveru pokrene `docker compose pull && up -d`
#
# Server ima ISTI `docker-compose.yml` koji koristiš lokalno — to je i bila
# poenta Faze 2. Razlika je samo u tome što `api` servis ne gradi sliku iz
# izvornog koda nego je povlači iz registry-ja (vidi compose override ispod).
#
# PREDNOST: ovo je jeftinije i prenosivo. Isti workflow radi na bilo kom VPS-u.
# MANA: ti održavaš mašinu — zakrpe, firewall, sertifikate, backup.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-hetzner
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build i push slike
    runs-on: ubuntu-latest
    # KAPIJA — i nije samo „da li je CI prošao".
    #
    # `branches: [main]` gore NE ŠTITI od tuđeg koda: kod `workflow_run` filter
    # gleda IME GRANE iz koje je CI pokrenut. PR iz forka čija se grana takođe
    # zove `main` prolazi taj filter — a korak ispod bi zatim preuzeo
    # `head_sha`, dakle KOD IZ FORKA, napravio sliku i deployovao je na Hetzner
    # našim SSH ključem. Javni repo to čini realnim napadom, ne teorijom.
    #
    # Zato se traži sve troje: CI je pokrenut PUSH-om, u OVOM repou, na main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Prijava na GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Odredi tagove
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Postavi Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # DEPLOY PREKO SSH-a
  #
  # Migracije se ovde NE rade zasebnim korakom kao na Azure-u. Razlog: Hetzner
  # baza nije izložena internetu (i ne treba da bude), pa runner ne može do nje.
  # Migracije izvršava sama aplikacija pri startu — `MigrateAsync()` u Program.cs.
  #
  # To je prihvatljivo dok se vrti JEDNA instanca. Kad se pređe na više, ovo
  # mora da se izdvoji u zaseban `docker compose run --rm api dotnet ef ...`
  # korak koji se izvrši pre nego što nove instance krenu.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy na Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-hetzner
      url: https://${{ vars.HETZNER_API_DOMAIN }}

    steps:
      - name: Deploy preko SSH-a
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_SSH_PORT || 22 }}
          # Otisak ključa SERVERA (ne našeg): bez njega bi se runner povezao i
          # na lažni server postavljen usred puta. Prazan secret = bez provere
          # (stanje pre C3); vrednost: `ssh-keygen -lf
          # /etc/ssh/ssh_host_ed25519_key.pub -E sha256` → deo „SHA256:…".
          fingerprint: ${{ secrets.HETZNER_HOST_FINGERPRINT }}
          # Bez ovoga se komande izvršavaju u login shell-u bez `set -e`, pa bi
          # neuspeo `pull` prošao neprimećeno a `up -d` digao staru sliku.
          script_stop: true
          # ── ZAŠTO SKRIPTA IZGLEDA OVAKO (C3) ─────────────────────────────
          # Ceo deploy je u /opt/usluzionica/deploy.sh (deploy/deploy.sh u
          # repou). Posle C3 ključ za CD u authorized_keys ima forced command:
          # sshd IGNORIŠE ovaj tekst i pokreće deploy.sh, koji iz njega čita
          # SAMO `DEPLOY_TAG=sha-…`. Zato:
          #   • DEPLOY_TAG= sme da se pojavi TAČNO JEDNOM u tekstu ispod,
          #   • komentari NE idu u blok `script` (i oni se šalju na server),
          #   • deo posle `fi` je stari deploy, za server na kom deploy.sh još ne
          #     postoji — redosled koraka C3 tako ne može da obori CD.
          script: |
            set -euo pipefail
            if [ -x /opt/usluzionica/deploy.sh ]; then
              /opt/usluzionica/deploy.sh "DEPLOY_TAG=${{ needs.build-and-push.outputs.image-tag }}"
              exit 0
            fi
            echo "deploy.sh ne postoji na serveru, stari nacin (vidi C3)"
            cd /opt/usluzionica
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi
            sed -i "/^IMAGE_TAG=/d" .env
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}" >> .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api
            docker image prune -af --filter "until=168h"

      # ── SMOKE TEST ───────────────────────────────────────────────────────
      # Ide sa runnera preko interneta, dakle proverava i da su DNS, reverse
      # proxy i TLS ispravni — ne samo da kontejner radi.
      - name: Smoke test /health
        run: |
          set -euo pipefail
          URL="https://${{ vars.HETZNER_API_DOMAIN }}/health"
          echo "Čekam da $URL odgovori..."

          for i in $(seq 1 24); do
            CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [[ "$CODE" == "200" ]]; then
              echo "Zdrav posle $((i*5)) s: $(cat /tmp/health.txt)"
              echo "### Deploy uspešan — /health vraća 200" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "  pokušaj $i/24: HTTP $CODE"
            sleep 5
          done

          echo "::error::/health nije odgovorio 200 ni posle 2 minuta."
          exit 1

      - name: Uputstvo za rollback ako je palo
        if: failure()
        run: |
          echo "### Deploy pao — rollback" >> "$GITHUB_STEP_SUMMARY"
          echo 'Na serveru:' >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo '/opt/usluzionica/deploy.sh DEPLOY_TAG=sha-PRETHODNI' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'Prethodni tag ispisuje log koraka „Deploy preko SSH-a" (red „Rollback:"). Bez deploy.sh:' >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'cd /opt/usluzionica' >> "$GITHUB_STEP_SUMMARY"
          echo 'sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=sha-PRETHODNI/" .env' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

# ═══════════════════════════════════════════════════════════════════════════
# ŠTA TREBA PODESITI (kad uzmeš server)
#
# Secrets:
#   HETZNER_HOST      IP ili hostname servera
#   HETZNER_USER      korisnik za deploy — NE root, vidi napomenu
#   HETZNER_SSH_KEY   PRIVATNI ključ (ceo, sa BEGIN/END redovima)
#   HETZNER_SSH_PORT  opciono, ako SSH nije na 22
#   GHCR_TOKEN        GitHub PAT sa `read:packages`
#
# Variables:
#   HETZNER_API_DOMAIN   npr. api.usluzionica.rs
#
# Na serveru:
#   1. Napravi korisnika `deploy` u grupi `docker` — ne deployuj kao root.
#      Ako ključ procuri, napadač dobija docker, ne ceo sistem.
#   2. /opt/usluzionica/ sadrži docker-compose.yml, docker-compose.prod.yml i .env
#   3. Reverse proxy (Caddy ili nginx) za TLS — kontejner sluša HTTP na 8080,
#      proxy radi HTTPS na 443. Caddy sam vadi Let's Encrypt sertifikat.
# ═══════════════════════════════════════════════════════════════════════════
