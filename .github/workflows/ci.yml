name: CI

# Okida se na svaki push i na svaki PR ka main.
# Cilj: nijedna promena ne stiže na main a da testovi nisu prošli.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # ručno pokretanje iz GitHub UI-ja

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # Testcontainers ne treba da proverava verziju u svakom run-u.
  TESTCONTAINERS_RYUK_DISABLED: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Unit testovi — bez Dockera, gotovi za sekunde. Namerno odvojeni da bi
  # greška u čistoj logici pala brzo, bez čekanja na SQL Server kontejner.
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Postavi .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Keširaj NuGet pakete
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore UsluzionicaServer.sln

      - name: Build
        run: dotnet build UsluzionicaServer.sln --no-restore --configuration Release

      - name: Unit testovi
        run: >
          dotnet test tests/UsluzionicaServer.UnitTests/UsluzionicaServer.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Objavi rezultate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/

  # ──────────────────────────────────────────────────────────────────────────
  # Integracioni testovi — Testcontainers podiže pravi SQL Server.
  # ubuntu-latest runner ima Docker unapred instaliran, pa nije potrebna
  # nikakva dodatna priprema.
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integracioni testovi
    runs-on: ubuntu-latest
    # Ne troši ~2 min na povlačenje SQL Server slike ako unit testovi već pucaju.
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Postavi .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Keširaj NuGet pakete
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Povuci SQL Server sliku unapred
        # Odvojen korak da se u logu jasno vidi koliko traje preuzimanje,
        # umesto da izgleda kao da su testovi spori.
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Restore
        run: dotnet restore UsluzionicaServer.sln

      - name: Build
        run: dotnet build UsluzionicaServer.sln --no-restore --configuration Release

      - name: Integracioni testovi
        run: >
          dotnet test tests/UsluzionicaServer.IntegrationTests/UsluzionicaServer.IntegrationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Objavi rezultate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/

  # ──────────────────────────────────────────────────────────────────────────
  # Sažetak u PR-u — bez ovoga rezultate treba tražiti po artefaktima.
  # ──────────────────────────────────────────────────────────────────────────
  report:
    name: Izveštaj
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Preuzmi rezultate
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Prikaži rezultate testova
        uses: dorny/test-reporter@v1
        with:
          name: Rezultati testova
          path: 'results/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false
